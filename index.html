 with supplies already running short.",win:"The sick were stabilised and the source of the fever isolated before it spread upriver.",fail:"The clinic ran out of time and medicine; regional healers took over the camp."},"Map the Northern Pass":{open:"The survey team entered the pass with rope, ink and strict instructions to mark every choke point.",win:"A complete route map returned, including two hidden paths and a dangerous rockfall zone.",fail:"Bad weather forced the survey back with only a partial map."},"Challenge the Roadside Duelist":{open:"The duelist waited beside the milestone, sword already drawn but point lowered.",win:"The challenge ended cleanly and the duelist agreed to leave village travellers alone.",fail:"The challenger was beaten and the duelist kept control of the road for another day."},"Guard the Shrine Procession":{open:"The shrine procession moved slowly through streets too narrow for a conventional guard formation.",win:"Pickpockets and would-be attackers were intercepted without breaking the procession.",fail:"The crowd split the escort and thieves reached the offering chests."},"Investigate the Empty Village":{open:"No smoke rose from the farming settlement when the cell reached the ridge above it.",win:"The villagers were found hiding from raiders in irrigation tunnels and escorted back safely.",fail:"The settlement yielded clues but no survivors or clear answer before the cell withdrew."},"Drive Off the River Pirates":{open:"Three low pirate boats were sighted using the reed islands as cover.",win:"The pirate crews were driven from the river and two stolen barges recovered.",fail:"The pirates escaped downstream after damaging another merchant barge."},"Recover the Stolen Medicine":{open:"Broken crate slats and medicinal powder marked the route of the stolen shipment.",win:"The medicine was recovered before heat spoiled the most fragile supplies.",fail:"The thieves destroyed the shipment when cornered, leaving nothing usable to recover."},"Infiltrate the Bandit Camp":{open:"The bandit camp had doubled its sentries after sunset and changed its challenge signs.",win:"The cell identified the commanders, stores and escape routes without exposing the infiltration.",fail:"A sentry challenged the wrong disguise and the cell fought its way out before the camp could close around them."},"Retrieve the Stolen Scroll":{open:"The stolen scroll's seal was designed to survive theft, but not prolonged tampering.",win:"The scroll was recovered with every seal intact and returned directly to the archive.",fail:"The thieves moved the scroll before the cell reached the hideout; its location is unknown again."},"Duel the Rogue Swordsman":{open:"The missing-nin chose an abandoned bridge where only two people could stand abreast.",win:"The rogue swordsman was defeated and their blade taken into village custody.",fail:"The swordsman broke the cell's formation and escaped into the gorge."},"Sabotage the Storehouse":{open:"Enemy stores were guarded by patrols whose routes overlapped every seven minutes.",win:"The supports were cut and the supplies destroyed after the cell was already clear of the perimeter.",fail:"An alarm forced an early withdrawal; the storehouse survived."},"Rescue the Poisoned Caravan":{open:"The caravan's distress flare was visible above the trees before the cell reached the road.",win:"Antidote was administered in time and the survivors were escorted home.",fail:"The poison progressed too quickly and the cell could only recover part of the cargo."},"Intercept the Border Couriers":{open:"Two couriers were expected to cross the border markers before moonrise.",win:"Both dispatches were captured before either courier could destroy them.",fail:"One courier broke through the interception line and carried the message onward."},"Destroy the Hidden Bridge":{open:"The bridge could only be seen from below the ravine, hidden by woven camouflage.",win:"Its main supports were destroyed and the enemy reinforcement route collapsed with them.",fail:"The demolition team was spotted before charges could be placed."},"Expose the False Magistrate":{open:"The magistrate's handwriting, habits and household staff all appeared correct at first inspection.",win:"A contradiction in the official seals exposed the infiltrator and the real magistrate's location was recovered.",fail:"The evidence remained circumstantial and the suspect disappeared before a second interview."},"Hunt the Marsh Beast":{open:"Patrol tracks ended abruptly in water too shallow to hide anything that large.",win:"The beast was tracked to its nest and driven away from the patrol route.",fail:"The marsh swallowed the trail and the creature struck again during the withdrawal."},"Protect the Defecting Informant":{open:"The informant arrived early, terrified and already convinced they had been followed.",win:"The pursuit team was misdirected and the informant reached the extraction point alive.",fail:"The escort was compromised and the informant vanished during the fighting."},"Silence the War-Horn Tower":{open:"The horn tower could warn three forts within seconds of a signal fire.",win:"The horn mechanism was disabled without a signal leaving the tower.",fail:"A sentry reached the horn before the cell could stop the alarm."},"Steal the Fox Lord's Ledger":{open:"The Fox Lord kept the ledger inside a private wing guarded by servants who knew one another by name.",win:"The ledger was copied and replaced before its absence could be noticed.",fail:"The estate locked down and the cell abandoned the ledger to escape unseen."},"Extract the Captured Scout":{open:"Interrogation was scheduled to begin before dawn, leaving only one viable extraction window.",win:"The scout was removed from custody and stabilised before crossing friendly lines.",fail:"The prison wing sealed before the cell reached the captive."},"Hunt the Missing-nin":{open:"The missing-nin had begun selling route maps only village operatives should know.",win:"The traitor was cornered before the next exchange and the stolen route book recovered.",fail:"A prepared escape route let the target disappear moments before capture."},"Read the Crimson Eye":{open:"Every previous ambush had failed as though the target had seen it before it happened.",win:"The cell baited the ocular technique into a false read and finally broke the target's prediction loop.",fail:"The Crimson Eye read the formation too quickly and forced the cell into retreat."},"Break the Siege Engineers":{open:"The siege train moved under heavy escort and could reach allied walls by the next night.",win:"The engines burned before they could be deployed and the surviving crews scattered.",fail:"The escort held long enough for the siege train to reach the protected road."},"Escort the Daimyo's Envoy":{open:"The envoy refused to delay negotiations despite three separate assassination warnings.",win:"The convoy survived two attacks and delivered the envoy to the negotiating hall on time.",fail:"The route became untenable and the envoy was forced to turn back under guard."},"Capture the Poison Master":{open:"The target carried enough toxins to kill themselves, the cell and any careless pursuer.",win:"The Poison Master was restrained alive with their antidote kit intact.",fail:"A cloud of toxin covered the target's escape and forced immediate medical withdrawal."},"Raid the Hidden Arsenal":{open:"The arsenal was built beneath a dye warehouse with weapons moving out every hour.",win:"The stockpile was seized and the tunnel exits collapsed behind the retreating cell.",fail:"The guards moved the most valuable weapons before the raid reached the vault."},"Hold the Mountain Gate":{open:"Refugees were still crossing the pass when enemy scouts appeared below the gate.",win:"The cell held until the last civilians cleared the ridge, then withdrew in order.",fail:"The line broke early and the evacuation scattered into secondary routes."},"Storm the Obsidian Keep":{open:"The keep's black walls had never been breached in a direct assault.",win:"The inner gate fell before the defenders could reorganise and the keep was taken by dawn.",fail:"The assault reached the inner wall but could not hold the breach."},"Steal the Shogun's Seal":{open:"The seal never left the Shogun's inner apartments except during formal audiences.",win:"The seal was removed, copied and replaced without the palace understanding how close the breach had come.",fail:"The palace entered full lockdown before the cell reached the inner chambers."},"The Nine-Tailed Contract":{open:"The contract chamber was sealed with bindings older than the current village system.",win:"The contract was secured and resealed for transport without triggering its final ward.",fail:"The warding pattern destabilised and forced the cell to abandon the chamber."},"Sever the Serpent's Head":{open:"The Serpent commander moved headquarters every night and executed anyone who learned the next location.",win:"The command tent was found and the Serpent's chain of command collapsed before sunrise.",fail:"A decoy headquarters bought the commander enough time to escape."},"Mirror-Eye Conspiracy":{open:"Deployment orders were being anticipated before they left the village, pointing to a network rather than one spy.",win:"The Mirror-Eye relay was exposed and its observers captured in a coordinated sweep.",fail:"The network burned its safe houses and disappeared before the cell could close the circle."},"Break the Five-Fortress Line":{open:"Five forts covered one another so precisely that attacking any single position strengthened the other four.",win:"The cell disrupted the relay timing and opened a corridor through the entire defensive line.",fail:"The forts recovered their coordination faster than expected and sealed the breach."},"Recover the Forbidden Archive":{open:"The underground archive was already collapsing when its outer seals finally opened.",win:"The core records were extracted moments before the lower vault disappeared beneath the rubble.",fail:"The collapse cut off the central archive and the cell escaped with only fragments."},"Defend the Kage Summit":{open:"The summit hall was already compromised; the assassins had entered before the leaders arrived.",win:"The assassination force was isolated and every protected leader survived the summit.",fail:"The attackers forced an emergency evacuation and the summit ended without agreement."},"Hunt the Living Weapon":{open:"The target's chakra signature registered more like a siege engine than a human shinobi.",win:"The Living Weapon was subdued without allowing the altered chakra system to detonate.",fail:"The target broke containment and disappeared after levelling the pursuit route."},"End the Silent War":{open:"The covert network had operated inside allied territory long enough to become part of the landscape.",win:"Safe houses, handlers and compromised officials were struck in one night, ending the network before it could scatter.",fail:"The first arrest alerted the remaining cells and the Silent War vanished back underground."},"Academy Prodigy Assessment":{open:"The academy examiner cleared the training hall and admitted only one candidate.",win:"The examiner signed the candidate's record with a rare recommendation for accelerated study.",fail:"The candidate was stopped before the final exercise and sent home to recover."},"Veteran's Survival Course":{open:"The veteran took away the candidate's map, spare food and every comfort item before opening the gate.",win:"The candidate returned under their own power and earned the veteran's field mark.",fail:"A recovery team found the candidate before the course's final marker."},"The Breakthrough Trial":{open:"The sealed ground closed behind the candidate; no instructor entered with them.",win:"The candidate emerged with their chakra pattern measurably changed by the ordeal.",fail:"The trial ended in exhaustion and injury before the breakthrough point was reached."},"Night Hunter's Oath":{open:"The covert order gave the candidate a target, a time and no extraction plan.",win:"The target marker was returned without a single alarm being raised.",fail:"The pursuit force identified the candidate and drove them out before completion."},"The Duelist's Mark":{open:"The sword master drew a circle in the dust and asked the challenger to step inside alone.",win:"The master lowered their blade first and awarded the Duelist's Mark.",fail:"The challenger was disarmed before landing a decisive strike."},"Ancient Chakra Path":{open:"Each stone on the ruined path pressed harder against the candidate's chakra network.",win:"The candidate reached the final shrine and returned with a denser, more stable chakra flow.",fail:"The pressure became unsafe and the candidate was pulled from the path before permanent damage."},"Audience with the Thunder Master":{open:"Lightning struck the hermit's ridge often enough that every tree bore a black scar.",win:"The Thunder Master demonstrated Flash Step Strike once, then made the student reproduce it under live lightning.",fail:"The master ended the lesson after the candidate failed to control the discharge safely."},"The Buried Barrier Formula":{open:"The archive entrance was found beneath three generations of collapsed foundation stone.",win:"The complete barrier formula was recovered and copied into the village research archive.",fail:"The inner chamber collapsed before the formula could be fully transcribed."},"The Legendary Mentor's Challenge":{open:"The mentor refused introductions and began the test the moment the candidate arrived.",win:"The mentor finally smiled; the candidate had pushed past a limit everyone else treated as fixed.",fail:"The mentor stopped the fight before the candidate destroyed themselves chasing the breakthrough."},"Trial of the War Hero":{open:"The exercise began with the candidates already surrounded and outnumbered.",win:"The veterans accepted the candidates into their order after th
