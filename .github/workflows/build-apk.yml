name: Build Shadow Village APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v16-specialist-combat-rework
      - browser-iphone-pwa

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Keep debug signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shadow-village-debug-keystore-v1

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Assemble current Shadow Village source
        run: bash overrides/assemble_current_game.sh

      - name: Upload current patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Village-Current-Patched-Source
          path: app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Install Capacitor build tools
        working-directory: app
        run: npm install --save-dev @capacitor/cli@8.5.0 @capacitor/assets

      - name: Build game
        working-directory: app
        run: npm run build

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android app icon
        working-directory: app
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0d0e1a' \
            --iconBackgroundColorDark '#0d0e1a' \
            --splashBackgroundColor '#0d0e1a' \
            --splashBackgroundColorDark '#0d0e1a'

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Village-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
