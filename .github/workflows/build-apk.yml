name: Build Shadow Village APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Unpack game
        run: |
          mkdir -p app
          unzip -q ninja-game.zip -d app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Update Capacitor CLI
        working-directory: app
        run: npm install --save-dev @capacitor/cli@8.5.0

      - name: Build game
        working-directory: app
        run: npm run build

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Village-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
