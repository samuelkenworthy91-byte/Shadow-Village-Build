name: Build Shadow Village APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - raid-visuals-v22
      - rank-exam-dev
      - save-slots-v24
      - target-selection-v25
      - feature/expanded-ninja-progression

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Keep debug signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shadow-village-debug-keystore-v1

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Unpack game
        run: |
          rm -rf app
          mkdir -p app
          unzip -q ninja-settlement-management-game-art-swap.zip -d app

      - name: Apply art and framing update
        run: |
          cp overrides/src/components/NinjaSprite.tsx app/src/components/NinjaSprite.tsx
          cp overrides/src/components/HUD.tsx app/src/components/HUD.tsx
          cp overrides/src/game/ninjaArt.ts app/src/game/ninjaArt.ts
          cp overrides/public/sw.js app/public/sw.js
          cp overrides/public/manifest.webmanifest app/public/manifest.webmanifest
          cat overrides/icon_parts/*.txt | tr -d '\n\r' | base64 --decode > /tmp/shadow-village-logo.png
          convert /tmp/shadow-village-logo.png -resize 512x512 app/public/icon.png
          mkdir -p app/assets
          convert /tmp/shadow-village-logo.png -resize 1024x1024 app/assets/logo.png

      - name: Apply raid balance and transparency update
        working-directory: app
        run: python ../overrides/apply_raid_balance.py

      - name: Apply raid classes and defender selection
        run: |
          cat overrides/raid_patch_b64_v22/part_* | tr -d '\n\r' | base64 --decode > /tmp/raid-v22.patch
          cd app
          set +e
          patch -p1 --forward < /tmp/raid-v22.patch
          PATCH_RC=$?
          set -e
          test -f src/components/RaidDefenseModal.tsx
          grep -q 'raid_select' src/game/types.ts
          grep -q 'dread_veteran' src/game/content.ts
          grep -q 'beginRaidBattle' src/game/engine.ts
          grep -q 'bg-raid-field.jpg' src/components/BattleScreen.tsx
          cd ..
          cp overrides/raid_sw_v22.js app/public/sw.js
          mkdir -p app/public/raiders
          cp overrides/raid_assets_direct_v22/raiders/*.webp app/public/raiders/
          cp overrides/raid_assets_direct_v22/bg-raid-field.jpg app/public/bg-raid-field.jpg
          echo "Patch return code: $PATCH_RC (service-worker hunk is intentionally replaced by override)"

      - name: Verify raid assets
        run: |
          test -f app/src/components/RaidDefenseModal.tsx
          test -s app/public/bg-raid-field.jpg
          test "$(find app/public/raiders -name '*.webp' | wc -l)" -eq 10
          grep -q 'shadow-village-v5-raiders10-field' app/public/sw.js

      - name: Apply rank-up exam update
        run: |
          cd app
          python ../overrides/apply_rank_exam.py
          cd ..
          cat overrides/rank_exam_assets_b64_v23/part_* | tr -d '\n\r' | base64 --decode > app/public/bg-exam-arena.jpg
          test -s app/public/bg-exam-arena.jpg
          grep -q 'startExamBattle' app/src/game/battle.ts
          grep -q 'TAKE EXAM' app/src/components/NinjaDetail.tsx
          grep -q 'shadow-village-v6-rank-exams' app/public/sw.js

      - name: Apply raid rebalance and three local save slots
        run: |
          cat overrides/v24_patch_parts/part_* > /tmp/v24.patch
          cd app
          patch -p1 < /tmp/v24.patch
          cd ..
          cp overrides/src/game/save.ts app/src/game/save.ts
          sed -i 's/shadow-village-v6-rank-exams/shadow-village-v7-save-slots/' app/public/sw.js
          grep -q 'LOCAL SAVE SLOTS' app/src/components/Overlays.tsx
          grep -q 'saveSlot' app/src/App.tsx
          grep -q '4.8 + (s.day - 1) \* 1.2' app/src/game/battle.ts
          grep -q 'shadow-village-v7-save-slots' app/public/sw.js

      - name: Apply universal battle target selection
        run: |
          cd app
          python ../overrides/apply_target_selection.py
          cd ..
          sed -i 's/shadow-village-v7-save-slots/shadow-village-v8-target-selection/' app/public/sw.js
          grep -q 'type TargetMode = "foe" | "ally" | "downed_ally" | null' app/src/components/BattleScreen.tsx
          grep -q 'targetPrompt(pendingMode, pending)' app/src/components/BattleScreen.tsx
          grep -q 'target && target.foe === u.foe && !target.alive' app/src/game/battle.ts
          grep -q 'shadow-village-v8-target-selection' app/public/sw.js

      - name: Export exact patched v2.5 source snapshot
        if: github.ref == 'refs/heads/feature/expanded-ninja-progression'
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Village-v2.5-Patched-Source
          path: app

      - name: Apply expanded ninja progression
        if: github.ref == 'refs/heads/feature/expanded-ninja-progression'
        run: |
          python overrides/apply_progression_expansion.py
          grep -q '"ken" | "doj" | "tac"' app/src/game/types.ts
          grep -q 'Dōjutsu Potential' app/src/game/content.ts
          grep -q "Commander's Gambit" app/src/game/perks.ts
          grep -q 'com.shadowvillage.game.progression' app/capacitor.config.ts
          grep -q 'SAVE_VERSION = 2' app/src/game/save.ts

      - name: Apply progression v0.2 village development
        if: github.ref == 'refs/heads/feature/expanded-ninja-progression'
        run: |
          cat overrides/progression_v02.patch.gz.b64 | tr -d '\n\r' | base64 --decode | gzip -d > /tmp/progression-v02.patch
          cd app
          patch -p1 < /tmp/progression-v02.patch
          cd ..
          grep -q 'VillageTechId' app/src/game/types.ts
          grep -q 'Mission Administration' app/src/game/content.ts
          grep -q 'Perfect Plan' app/src/game/perks.ts
          grep -q 'Quick Study' app/src/game/content.ts
          grep -q 'onResearch' app/src/components/BuildMenu.tsx

      - name: Apply progression v0.2.1 XP correction
        if: github.ref == 'refs/heads/feature/expanded-ninja-progression'
        run: |
          cd app
          patch -p1 < ../overrides/progression_v021.patch
          grep -q 'const mult = (hasTrait(n, "prodigy") ? 1.4 : 1) \* perkFx(n).xp;' src/game/engine.ts
          cd ..

      - name: Export progression source snapshot
        if: github.ref == 'refs/heads/feature/expanded-ninja-progression'
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Village-Progression-Dev-Source
          path: app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Install Capacitor build tools
        working-directory: app
        run: npm install --save-dev @capacitor/cli@8.5.0 @capacitor/assets

      - name: Build game
        working-directory: app
        run: npm run build

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android app icon
        working-directory: app
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0d0e1a' \
            --iconBackgroundColorDark '#0d0e1a' \
            --splashBackgroundColor '#0d0e1a' \
            --splashBackgroundColorDark '#0d0e1a'

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Village-Progression-Dev-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
