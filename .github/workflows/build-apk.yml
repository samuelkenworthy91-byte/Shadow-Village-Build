name: Build Kage Life APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/gameplay-v34

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Keep debug signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kage-life-debug-keystore-v36

      - name: Download last delivered APK for update verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LAST_RUN=$(gh run list --workflow build-apk.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$LAST_RUN"
          gh run download "$LAST_RUN" -n Kage-Life-APK -D previous-apk

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download verified pre-Arena base source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app
          # This is the exact base used by the verified portrait-QC APK.
          # Keep it pinned: newer main snapshots already contain these patches.
          RUN_ID="33427595025"
          test -n "$RUN_ID"
          echo "Using verified base patched-source run $RUN_ID"
          gh run download "$RUN_ID" -n Shadow-Village-v16-Patched-Source -D app
          test -f app/package.json
          test -f app/src/App.tsx
          test -f app/src/game/bingo.ts

      - name: Verify Kage Life identity
        run: |
          set -euo pipefail
          grep -q 'Kage Life — Ninja Village Management' app/index.html
          grep -q 'villageName: string' app/src/game/types.ts
          grep -q 'VILLAGE NAME' app/src/components/Overlays.tsx
          grep -q 'You are the Kage' app/src/components/Overlays.tsx

      - name: Apply v27 portrait expansion 251-310
        run: |
          set -euo pipefail
          python overrides/portrait_library.py install --max-id 310
          python overrides/apply_ninja_portraits_v27.py
          python overrides/portrait_library.py validate --max-id 310

      - name: Apply v17 technique tree overhaul
        run: |
          set -euo pipefail
          python overrides/apply_village_depth_v17_technique_nodes.py
          grep -q 'TECHNIQUE_NODES' app/src/game/techniques.ts
          grep -q 'outgoingTechniqueMult' app/src/game/battle.ts

      - name: Apply v28 portrait expansion 311-370
        run: |
          set -euo pipefail
          python overrides/apply_ninja_portraits_v28.py
          python overrides/portrait_library.py validate
          grep -q 'length: 370' app/src/game/ninjaArt.ts

      - name: Apply v29 individual portraits and no-repeat assignment
        run: |
          set -euo pipefail
          python overrides/apply_ninja_portraits_v29.py
          grep -q 'portrait?: number' app/src/game/types.ts
          grep -q 'const freeArt = GENERAL_ART_IDS.filter' app/src/game/engine.ts
          grep -q 'n.portrait' app/src/game/ninjaArt.ts

      - name: Apply v30 Mission Board daily projections
        run: |
          set -euo pipefail
          python overrides/apply_ui_daily_panel_v30.py
          grep -q 'function DailyProjections' app/src/components/MissionBoard.tsx
          grep -q "TOMORROW'S PROJECTIONS" app/src/components/MissionBoard.tsx
          ! grep -q 'gain={nextGoldFromBuildings}' app/src/components/HUD.tsx

      - name: Apply v31 generated building art
        run: |
          set -euo pipefail
          SRC_COUNT="$(find overrides/building_assets_v31 -maxdepth 1 -name 'bld_*.webp' | wc -l)"
          test "$SRC_COUNT" -gt 0
          python overrides/apply_building_art_v31.py
          OUT_COUNT="$(find app/public/buildings -maxdepth 1 -name 'bld_*.webp' | wc -l)"
          test "$OUT_COUNT" -eq "$SRC_COUNT"
          grep -q 'className="b-art"' app/src/components/Scene.tsx
          grep -q 'BLD_ART.has(t)' app/src/components/Scene.tsx
          echo "v31 building art installed: $OUT_COUNT assets"

      - name: Apply v18 elemental type advantage
        run: |
          set -euo pipefail
          python overrides/apply_village_depth_v18_type_advantage.py
          grep -q 'NATURE_BEATS' app/src/game/battle.ts
          grep -q 'typeUnderdogBonus' app/src/game/perks.ts

      - name: Apply v19 dekanji and clarity pass
        run: |
          set -euo pipefail
          python overrides/apply_village_depth_v19_dekanji.py
          grep -q 'kage-life-v4-elemental-clarity' app/public/sw.js

      - name: Apply reviewed portrait quality control
        run: |
          set -euo pipefail
          python overrides/apply_portrait_qc_v33.py
          python work/check_portrait_qc_v33.py

      - name: Apply v34 gameplay and restore summons
        run: python overrides/apply_gameplay_v34.py

      - name: Apply v35 phone safe area
        run: python overrides/apply_phone_safe_area_v35.py

      - name: Apply v36 jutsu descriptions and flavour
        run: python overrides/apply_jutsu_descriptions_v36.py

      - name: Validate complete Kage Life source
        run: |
          set -euo pipefail
          test -f app/src/game/techniques.ts
          python overrides/portrait_library.py validate
          SRC_BLD_COUNT="$(find overrides/building_assets_v31 -maxdepth 1 -name 'bld_*.webp' | wc -l)"
          OUT_BLD_COUNT="$(find app/public/buildings -maxdepth 1 -name 'bld_*.webp' | wc -l)"
          test "$SRC_BLD_COUNT" -gt 0
          test "$OUT_BLD_COUNT" -eq "$SRC_BLD_COUNT"
          grep -q 'Portrait QC v33' app/src/game/ninjaArt.ts
          grep -q 'kage-life-v8-jutsu-mechanics' app/public/sw.js
          grep -q 'viewport-fit=contain' app/index.html
          grep -q 'portrait?: number' app/src/game/types.ts
          grep -q 'function DailyProjections' app/src/components/MissionBoard.tsx
          grep -q 'className="b-art"' app/src/components/Scene.tsx
          python - <<'PY'
          from pathlib import Path
          import re
          rx = re.compile(r'[\u3000-\u303f\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]')
          roots = [Path('app/src'), Path('app/index.html'), Path('app/public/sw.js')]
          bad = []
          for root in roots:
              files = root.rglob('*') if root.is_dir() else [root]
              for p in files:
                  if p.is_file() and p.suffix in {'.ts','.tsx','.css','.html','.js'}:
                      text = p.read_text(encoding='utf-8', errors='ignore')
                      if rx.search(text):
                          bad.append(str(p))
          if bad:
              raise SystemExit('Japanese/CJK remains in: ' + ', '.join(bad[:20]))
          print('PR5 V31 source validation passed: 340 approved portraits, building sprites, zero CJK')
          PY

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: Kage-Life-Patched-Source
          path: app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Verify portrait selection and saved identities
        run: |
          app/node_modules/.bin/esbuild work/check_portrait_selection_v33.ts --bundle --platform=node --outfile=/tmp/check-portrait-selection.cjs
          node /tmp/check-portrait-selection.cjs

      - name: Verify gameplay balance and summon mechanics
        run: |
          app/node_modules/.bin/esbuild work/check_gameplay_v34.ts --bundle --platform=node --outfile=/tmp/check-gameplay-v34.cjs
          node /tmp/check-gameplay-v34.cjs

      - name: Verify descriptions and existing save slots
        run: |
          app/node_modules/.bin/esbuild work/check_jutsu_descriptions_v36.ts --bundle --platform=node --outfile=/tmp/check-v36.cjs
          node /tmp/check-v36.cjs

      - name: Verify mobile summon and jutsu screens
        timeout-minutes: 8
        run: |
          npm install --prefix /tmp/kage-browser playwright@1.62.1
          /tmp/kage-browser/node_modules/.bin/playwright install --with-deps chromium
          node work/check_gameplay_v34_browser.mjs

      - name: Upload mobile verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kage-Life-Mobile-QC
          path: browser-results
          if-no-files-found: ignore

      - name: Install Capacitor build tools
        working-directory: app
        run: npm install --save-dev @capacitor/cli@8.5.0 @capacitor/assets

      - name: Build game
        working-directory: app
        run: npm run build

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Set increasing Android update version
        run: python work/configure_android_update_v36.py

      - name: Generate Android Kage Life icon and splash
        working-directory: app
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0d0e1a' \
            --iconBackgroundColorDark '#0d0e1a' \
            --splashBackgroundColor '#0d0e1a' \
            --splashBackgroundColorDark '#0d0e1a'

      - name: Verify Android display name
        working-directory: app
        run: |
          grep -q 'appName: "Kage Life"' capacitor.config.ts

      - name: Prepare retained APK signing key
        env:
          KAGE_LIFE_KEYSTORE_BASE64: ${{ secrets.KAGE_LIFE_KEYSTORE_BASE64 }}
          # User authorised this one build despite the missing legacy key.
          # Later pushes must restore the retained key, never silently rotate it.
          ALLOW_NEW_SIGNING_KEY: ${{ github.event.before == '1d5c8370bde1a84020a1dafb0706819e641424ac' }}
        run: python work/restore_android_signing_v36.py

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK and report update compatibility
        env:
          ALLOW_NEW_SIGNING_KEY: ${{ github.event.before == '1d5c8370bde1a84020a1dafb0706819e641424ac' }}
        run: python work/check_apk_upgrade_v36.py

      - name: Upload update compatibility report
        uses: actions/upload-artifact@v4
        with:
          name: Kage-Life-Upgrade-QC
          path: upgrade-results

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kage-Life-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
