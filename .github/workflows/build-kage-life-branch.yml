name: Build Kage Life Branch APK

on:
  workflow_dispatch:
  push:
    branches:
      - kage-life-village-rename
      - arena/01a05b52-shadow-village-build

permissions:
  contents: read
  actions: read

jobs:
  build-kage-life:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kage Life branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Keep debug signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shadow-village-debug-keystore-v1

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Download current main patched source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf app
          mkdir -p app
          RUN_ID="$(gh run list --workflow build-apk.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          echo "Using successful main build run $RUN_ID"
          gh run download "$RUN_ID" -n Shadow-Village-v16-Patched-Source -D app
          test -f app/package.json
          test -f app/src/App.tsx
          test -f app/src/game/bingo.ts

      - name: Normalize legacy branding input
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          def normalize(path: str, pattern: str, replacement: str, label: str) -> None:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if replacement in s:
                  return
              s, n = re.subn(pattern, lambda _m: replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'Could not normalize {label}: {n} matches')
              p.write_text(s, encoding='utf-8')

          normalize(
              'app/index.html',
              r'<meta name="description" content="[^"]*"\s*/>',
              '<meta name="description" content="Shadow Village — build a hidden ninja settlement, train shinobi, deploy squads on skill-based missions, and survive the raids." />',
              'index description',
          )
          normalize(
              'app/index.html',
              r'<title>[^<]*</title>',
              '<title>Shadow Village — Ninja Settlement</title>',
              'index title',
          )
          normalize(
              'app/index.html',
              r'<meta name="apple-mobile-web-app-title" content="[^"]*"\s*/>',
              '<meta name="apple-mobile-web-app-title" content="Shadow Village" />',
              'apple title',
          )
          normalize(
              'app/index.html',
              r'<meta name="application-name" content="[^"]*"\s*/>',
              '<meta name="application-name" content="Shadow Village" />',
              'application name',
          )

          manifest_path = Path('app/public/manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = 'Shadow Village — Ninja Settlement'
          manifest['short_name'] = 'Shadow Village'
          manifest['description'] = 'Build a hidden ninja village, train shinobi, deploy squads on missions, and survive the raids.'
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          normalize(
              'app/capacitor.config.ts',
              r'appName:\s*"[^"]*",',
              'appName: "Shadow Village — Progression Dev",',
              'capacitor app name',
          )
          PY

      - name: Apply Kage Life identity and final messaging
        run: |
          set -euo pipefail
          python overrides/apply_kage_life_rename.py
          python overrides/finalize_kage_life.py
          grep -q 'Kage Life — Ninja Village Management' app/index.html
          grep -q 'villageName: string' app/src/game/types.ts
          grep -q 'VILLAGE NAME' app/src/components/Overlays.tsx
          grep -q 'You are the Kage' app/src/components/Overlays.tsx
          grep -q 'KAGE LIFE · {s.villageName.toUpperCase()}' app/src/components/HUD.tsx
          grep -q 'former ${s.villageName} shinobi' app/src/game/bingo.ts
          ! grep -q 'This ninja will permanently leave Shadow Village' app/src/components/NinjaDetail.tsx

      - name: Apply v17 gameplay polish
        run: |
          python overrides/apply_v17_gameplay_polish.py
          grep -q 'export function rollPotential' app/src/game/engine.ts
          grep -q 'export function jutsuMechanics' app/src/game/jutsu.ts
          grep -q 'export function genjutsuMechanics' app/src/game/genjutsu.ts
          grep -q 'export function itemBonusTags' app/src/game/equipment.ts
          grep -q 'Equipment is completely unrestricted' app/src/game/equipment.ts
          grep -q 'function ResourceForecast' app/src/components/Scene.tsx
          test -f app/src/components/EquipmentArtwork.tsx
          grep -q 'academy_chakra_theory' app/src/game/content.ts
          grep -q 'market_war_chest' app/src/game/content.ts
          grep -q 'kage-life-v17-gameplay-polish' app/public/sw.js

      - name: Verify uploaded Kage Life logo
        run: |
          set -euo pipefail
          test "$(find overrides/kage_life_uploaded_logo_b64 -maxdepth 1 -name 'part_*' | wc -l)" -eq 10
          identify app/public/icon.png
          identify app/assets/logo.png

      - name: Upload Kage Life patched source
        uses: actions/upload-artifact@v4
        with:
          name: Kage-Life-Patched-Source
          path: app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Install Capacitor build tools
        working-directory: app
        run: npm install --save-dev @capacitor/cli@8.5.0 @capacitor/assets

      - name: Build game
        working-directory: app
        run: npm run build

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Android Kage Life icon and splash
        working-directory: app
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0d0e1a' \
            --iconBackgroundColorDark '#0d0e1a' \
            --splashBackgroundColor '#0d0e1a' \
            --splashBackgroundColorDark '#0d0e1a'

      - name: Verify Android display name
        working-directory: app
        run: |
          grep -q 'appName: "Kage Life"' capacitor.config.ts
          grep -R -q 'Kage Life' android/app/src/main/res || true

      - name: Build Kage Life APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Kage Life APK
        uses: actions/upload-artifact@v4
        with:
          name: Kage-Life-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
